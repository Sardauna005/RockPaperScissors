<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="rps.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <p>Click on buttons below to select your options! - Have Fun!</p>
      <p>Winner is First to Reach Five.</p>
      <button id="rb">Rock</button>
      <button id="pb">Paper</button>
      <button id="scb">Scissors</button>

      <h4 id="hscore">Human Score:</h4>
      <h4 id="cscore">Computer Score:</h4>

      <h1 id="result">Result:</h1>
      <button id="TryAgain">Try Again</button>
      <!-- Basic Html Format Done and Achieved. -->
    </div>
  </body>
</html>
